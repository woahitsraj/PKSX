<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 760 220"
	role="img"
	aria-labelledby="title desc"
>
	<title id="title">Retroid sampled main-thread heap peaks</title>
	<desc id="desc">
		Baseline: 27.4 MiB; Recovery: 26.5 MiB. One 30-minute stability run and 180 cycles per build.
	</desc>
	<rect width="760" height="220" fill="white" />
	<g font-family="Arial,sans-serif" fill="#17212b">
		<text x="20" y="28" font-size="18">Sampled main-thread V8 heap peak</text>
		<line x1="180" x2="180" y1="46" y2="150" stroke="#e1e6eb" />
		<text x="180" y="174" text-anchor="middle" font-size="12">0</text>
		<line x1="326.66666666666663" x2="326.66666666666663" y1="46" y2="150" stroke="#e1e6eb" />
		<text x="326.66666666666663" y="174" text-anchor="middle" font-size="12">10</text>
		<line x1="473.3333333333333" x2="473.3333333333333" y1="46" y2="150" stroke="#e1e6eb" />
		<text x="473.3333333333333" y="174" text-anchor="middle" font-size="12">20</text>
		<line x1="620" x2="620" y1="46" y2="150" stroke="#e1e6eb" />
		<text x="620" y="174" text-anchor="middle" font-size="12">30</text>
		<text x="20" y="79" font-size="15">Baseline</text>
		<rect x="180" y="60" width="401.4110972086588" height="26" rx="3" fill="#557b9b" />
		<text x="589.4110972086588" y="79" font-size="14">27.4 MiB</text>
		<text x="20" y="130" font-size="15">Recovery</text>
		<rect x="180" y="111" width="389.36451721191406" height="26" rx="3" fill="#33866d" />
		<text x="577.3645172119141" y="130" font-size="14">26.5 MiB</text>
		<text x="730" y="174" text-anchor="end" font-size="12">MiB</text>
		<text x="20" y="202" font-size="12" fill="#526170">
			One 30-minute run and 180 cycles per build. Sampled maxima; no memory-reduction claim.
		</text>
	</g>
</svg>
