name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  svelte-checks:
    name: Svelte checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test:unit -- --run

  pkhex-engine:
    name: PKHeX Engine publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Restore PKHeX Engine
        run: dotnet restore engine/Pksx.Pkhex.Engine/Pksx.Pkhex.Engine.csproj

      # PKHeX.Core currently emits an upstream IL2104 trim warning during Release publish.
      # Keep the warning visible in CI; see docs/architecture/pkhex-engine-trim-warnings.md.
      - name: Publish PKHeX Engine
        run: dotnet publish engine/Pksx.Pkhex.Engine/Pksx.Pkhex.Engine.csproj --configuration Release --no-restore

      - name: Sync published PKHeX Engine assets
        run: pnpm engine:sync -- --skip-publish

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Fixture-backed PKHeX Engine smoke test
        run: pnpm test:engine-smoke

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build web app
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build
          compression-level: 0
          retention-days: 7

  deploy-preview:
    name: Cloudflare preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    needs:
      - svelte-checks
      - pkhex-engine
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: build

      - name: Upload Cloudflare preview
        id: preview
        run: |
          preview_alias="pr-${{ github.event.pull_request.number }}"

          set +e
          preview_output=$(pnpm deploy:preview --preview-alias "$preview_alias" --message "PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}" 2>&1)
          preview_status=$?
          set -e
          printf '%s\n' "$preview_output"

          if [ "$preview_status" -ne 0 ] && grep -Fq 'does not yet exist' <<<"$preview_output"; then
            pnpm deploy:staging --message "Initial staging deployment from PR #${{ github.event.pull_request.number }}"
            preview_output=$(pnpm deploy:preview --preview-alias "$preview_alias" --message "PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}" 2>&1)
            printf '%s\n' "$preview_output"
          elif [ "$preview_status" -ne 0 ]; then
            exit "$preview_status"
          fi

          preview_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' <<<"$preview_output" | tail -n 1)
          if [ -z "$preview_url" ]; then
            echo "::error::Wrangler did not return a preview URL."
            exit 1
          fi

          printf 'url=%s\n' "$preview_url" >>"$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Update pull request preview comment
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- pksx-cloudflare-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            const pullRequest = context.payload.pull_request;
            const sha = pullRequest.head.sha;
            const shortSha = sha.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}
            ## Cloudflare preview

            | Environment | Link |
            | --- | --- |
            | This pull request | [Open preview](${previewUrl}) |
            | Staging | [staging.pksx.app](https://staging.pksx.app/) |

            Updated for commit [\`${shortSha}\`](${commitUrl}). [View workflow run](${runUrl}).`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body
              });
            }

  deploy-staging:
    name: Cloudflare staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - svelte-checks
      - pkhex-engine
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: build

      - name: Deploy Cloudflare staging
        run: pnpm deploy:staging --message "main at ${{ github.sha }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-production:
    name: Cloudflare production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - svelte-checks
      - pkhex-engine
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vX.Y.Z."
            exit 1
          fi

          tag_object=$(gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG")
          if [ "$(jq -r '.object.type' <<<"$tag_object")" != "tag" ]; then
            echo "::error::Release tag must be annotated and signed."
            exit 1
          fi

          tag_sha=$(jq -r '.object.sha' <<<"$tag_object")
          tag_details=$(gh api "repos/${{ github.repository }}/git/tags/$tag_sha")
          verified=$(jq -r '.verification.verified' <<<"$tag_details")
          if [ "$verified" != "true" ]; then
            echo "::error::GitHub did not verify the release tag signature."
            exit 1
          fi

          if [ "$(jq -r '.object.type' <<<"$tag_details")" != "commit" ]; then
            echo "::error::Release tag must point directly to a commit."
            exit 1
          fi

          release_commit=$(jq -r '.object.sha' <<<"$tag_details")
          git fetch origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag must point to a commit contained in main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: build

      - name: Deploy Cloudflare production
        run: pnpm deploy:production --message "${{ github.ref_name }} at ${{ github.sha }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
